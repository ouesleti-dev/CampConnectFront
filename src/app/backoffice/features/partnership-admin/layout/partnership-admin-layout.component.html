<div class="pa-shell-top">
  <!-- ── Top Navigation ── -->
  <header class="pa-header-top">
    <div class="pa-topbar-brand">
      <div class="pa-brand-logo">CC</div>
      <div class="pa-brand-text">
        <span class="pa-brand-title">CampConnect</span>
        <span class="pa-brand-sub">Partnership Admin</span>
      </div>
    </div>

    <nav class="pa-top-nav">
      <a *ngFor="let item of menu" 
         [routerLink]="item.path" 
         routerLinkActive="active" 
         class="pa-top-link">
        <span class="pa-nav-ico">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <div class="pa-topbar-actions">
      <button type="button" class="btn-sync" (click)="resyncFromServer()" *ngIf="useBackendPartnership" title="Sync API">
        🔄
      </button>
      
      <div class="pa-profile-compact">
        <div class="pa-avatar-sm">{{ userEmail[0].toUpperCase() }}</div>
        <div class="pa-profile-info">
          <span class="pa-user-email">{{ userEmail }}</span>
          <a href="javascript:void(0)" (click)="logout()" class="pa-logout-link">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <!-- ── Main Content ── -->
  <main class="pa-main-full">
    <div class="pa-content-container">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
