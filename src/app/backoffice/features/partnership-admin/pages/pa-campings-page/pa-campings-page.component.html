<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
  <h4 class="mb-0">Campings</h4>
  <button type="button" class="btn btn-primary rounded-pill px-4" (click)="openCreate()">Ajouter</button>
</div>
<div class="row g-2 mb-3">
  <div class="col-md-4">
    <select class="form-select rounded-pill" [(ngModel)]="filterPartnerId" (ngModelChange)="applyFilters()">
      <option [ngValue]="null">Tous les partenaires</option>
      <option *ngFor="let u of users" [ngValue]="u.id">{{ u.label }}</option>
    </select>
  </div>
  <div class="col-md-4">
    <input
      class="form-control rounded-pill"
      placeholder="Filtrer par localisation"
      [(ngModel)]="filterLoc"
      (ngModelChange)="applyFilters()"
    />
  </div>
</div>
<app-paginated-data-table
  [columns]="columns"
  [rows]="rows"
  [searchKeys]="searchKeys"
  (editRow)="openEdit($event)"
  (deleteRow)="remove($event)"
></app-paginated-data-table>

<div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-4">
      <div class="modal-header border-0">
        <h5 class="modal-title">{{ editingId ? 'Modifier' : 'Ajouter' }} camping</h5>
        <button type="button" class="btn-close" (click)="showModal = false"></button>
      </div>
      <div class="modal-body" [formGroup]="form">
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">Nom</label>
            <input class="form-control rounded-pill mb-1" [class.is-invalid]="invalidField('nom')" formControlName="nom" />
            <div class="invalid-feedback d-block" *ngIf="invalidField('nom')">{{ msgField('nom') }}</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Localisation</label>
            <input
              class="form-control rounded-pill mb-1"
              [class.is-invalid]="invalidField('localisation')"
              formControlName="localisation"
            />
            <div class="invalid-feedback d-block" *ngIf="invalidField('localisation')">{{ msgField('localisation') }}</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Capacité</label>
            <input
              type="number"
              class="form-control rounded-pill mb-1"
              [class.is-invalid]="invalidField('capacite')"
              formControlName="capacite"
            />
            <div class="invalid-feedback d-block" *ngIf="invalidField('capacite')">{{ msgField('capacite') }}</div>
          </div>
          <div class="col-12">
            <label class="form-label">Partenaires associés</label>
            <div class="d-flex flex-wrap gap-2 p-2 rounded-3 border" [class.border-danger]="partnersBlockError">
              <button
                type="button"
                *ngFor="let u of users"
                class="btn btn-sm rounded-pill"
                [class.btn-primary]="isPartnerChecked(u.id)"
                [class.btn-outline-primary]="!isPartnerChecked(u.id)"
                (click)="togglePartner(u.id)"
              >
                {{ u.label }}
              </button>
            </div>
            <div class="invalid-feedback d-block" *ngIf="partnersBlockError">Sélectionnez au moins un partenaire.</div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-secondary rounded-pill" (click)="showModal = false">Annuler</button>
        <button type="button" class="btn btn-primary rounded-pill" (click)="save()">Enregistrer</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" *ngIf="showModal" [class.show]="showModal"></div>
