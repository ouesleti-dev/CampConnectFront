<div class="sidebar">
  <div class="sidebar-header">
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--primary)" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 22h20L12 2z"></path></svg>
      </div>
      <h2>CampConnect</h2>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div *ngFor="let group of menuGroups" class="menu-group">
      <h3 class="menu-group-title" *ngIf="group.title !== 'MENU'">{{ group.title }}</h3>
      <ul>
        <li *ngFor="let item of group.items">

          <!-- Item with children (accordion) -->
          <ng-container *ngIf="item.children; else simpleLink">
            <button class="accordion-toggle" [class.open]="item.isOpen" (click)="toggleItem(item)">
              <span class="menu-icon" [innerHTML]="item.icon"></span>
              <span class="menu-label">{{ item.label }}</span>
              <span class="chevron">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
            </button>
            <ul class="submenu" [class.open]="item.isOpen">
              <li *ngFor="let child of item.children">
                <a [routerLink]="child.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="submenu-link">
                  <span class="submenu-dot"></span>
                  {{ child.label }}
                </a>
              </li>
            </ul>
          </ng-container>

          <!-- Simple link item -->
          <ng-template #simpleLink>
            <a [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
              <span class="menu-icon" [innerHTML]="item.icon"></span>
              <span class="menu-label">{{ item.label }}</span>
            </a>
          </ng-template>

        </li>
      </ul>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="promo-card">
      <div class="promo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"></path></svg>
      </div>
      <h4>Download our Mobile App</h4>
      <button class="btn-download">Download</button>
    </div>
  </div>
</div>
