<section class="cta-section">
  <div class="cta-overlay"></div>
  <div class="cta-content">
    <div class="container">
      <h2 class="cta-title">Ready for Your Next Adventure?</h2>
      <p class="cta-description">
        Join CampConnect today and discover endless camping possibilities
      </p>
      <div class="cta-buttons">
        <button (click)="navigateToExplore()" class="btn-primary btn-large">

        <button (click)="navigateToSignup()" class="btn-secondary btn-large">
          Get Started Free
        </button>

      <p class="cta-note">No credit card required • Join 10,000+ happy campers</p>
    </div>
  </div>
</section>
