<section class="hero-section">
  <div class="hero-bg-overlay"></div>
  <div class="container hero-container">
    <div class="hero-content">
      <div class="hero-badge animate-fade-in">
        <span class="badge-dot"></span>
        Explore the Great Outdoors
      </div>
      <h1 class="hero-title animate-slide-up">
        Connect Your <br>
        <span class="text-gradient">Camping Experience</span>
      </h1>
      <p class="hero-description animate-slide-up-delay-1">
        Your all-in-one smart platform for discovering campgrounds, renting gear, 
        and connecting with the camping community.
      </p>
      <div class="hero-actions animate-slide-up-delay-2">
        <button class="btn-premium-primary" routerLink="/marketplace">
          Explore Now
          <span class="btn-icon">→</span>
        </button>
        <button class="btn-premium-outline" routerLink="/campgrounds-forum">
          Discover Forum
        </button>
      </div>
    </div>
    
    <div class="hero-visual animate-fade-in-delay-1">
      <div class="glass-card">
        <div class="card-image-wrapper">
          <img src="https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=1000&q=80" alt="Beautiful Camping">
          <div class="card-overlay">
            <div class="stat-badge">
              <span class="stat-num">500+</span>
              <span class="stat-label">Destinations</span>
            </div>
          </div>
        </div>
      </div>
      <div class="floating-badge badge-1">
        <div class="badge-icon">🏕️</div>
        <div class="badge-text">
          <strong>Top Rated</strong>
          <span>Best in Class</span>
        </div>
      </div>
      <div class="floating-badge badge-2">
        <div class="badge-icon">⭐</div>
        <div class="badge-text">
          <strong>4.9/5</strong>
          <span>User Rating</span>
        </div>
      </div>
    </div>
  </div>
</section>
