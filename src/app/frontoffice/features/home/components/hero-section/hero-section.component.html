<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Section</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  .hero {
    background-color: #f4f1ed;
    padding: 80px 0;
  }

  .container {
    width: 90%;
    max-width: 1200px;
    margin: auto;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 60px;
  }

  .hero-text h1 {
    font-size: 48px;
    font-weight: 700;
    color: #111;
    line-height: 1.2;
    margin-bottom: 20px;
  }

  .hero-text p {
    font-size: 18px;
    color: #555;
    margin-bottom: 30px;
  }

  .hero-buttons {
    display: flex;
    gap: 20px;
  }

  .btn-primary {
    background-color: #557a46;
    color: white;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn-primary:hover {
    background-color: #466737;
  }

  .btn-outline {
    border: 2px solid #557a46;
    color: #557a46;
    padding: 14px 28px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn-outline:hover {
    background-color: rgba(85, 122, 70, 0.1);
  }

 .hero-image {
  display: flex;
  justify-content: center;
}

.hero-image img {
  width: 100%;        /* plus large */
  max-width: 600px;   /* largeur maximale */
  height: 300px;      /* 👈 hauteur réduite */
  object-fit: cover;  /* évite la déformation */
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
}



  /* Responsive */
  @media (max-width: 992px) {
    .hero-grid {
      grid-template-columns: 1fr;
      text-align: center;
    }

    .hero-buttons {
      justify-content: center;
      flex-direction: column;
      align-items: center;
    }
  }
</style>

</head>
<body>

<section class="hero">
  <div class="container">
    <div class="hero-grid">

      <div class="hero-text">
        <h1>Connect Your Camping Experience</h1>
        <p>All camping services in one smart platform</p>

        <div class="hero-buttons">
          <a href="#" class="btn-primary">Get Started</a>
          <a href="#" class="btn-outline">Discover Services</a>
        </div>
      </div>

      <div class="hero-image">
        <img src="https://images.unsplash.com/photo-1657038455340-d95a1cc49db8?auto=format&fit=crop&w=1080&q=80"
             alt="Camping tents">
      </div>

    </div>
  </div>
</section>

</body>
</html>
