<section class="services-section section">
  <div class="container">
    <div class="section-header animate-on-scroll">
      <span class="section-badge">Our ecosystem</span>
      <h2 class="section-title">Everything for Your Journey</h2>
      <p class="section-subtitle">Discover a wide range of services designed to make your camping experience seamless and enjoyable.</p>
    </div>
    
    <div class="services-grid">
      <div *ngFor="let service of services; let i = index" 
           class="service-card-premium" 
           [style.animation-delay]="(i * 0.1) + 's'">
        <div class="card-glow"></div>
        <div class="service-icon-wrapper">
          <span class="service-icon">{{ service.icon }}</span>
        </div>
        <h3 class="service-title">{{ service.title }}</h3>
        <p class="service-description">{{ service.description }}</p>
        <div class="card-footer">
          <a [routerLink]="service.route" class="learn-more-btn">
            Explore Service
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
