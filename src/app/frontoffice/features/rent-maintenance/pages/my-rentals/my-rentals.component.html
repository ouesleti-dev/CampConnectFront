<div class="page-container">
  <div class="page-header">
    <h2>My Rentals</h2>
    <p class="subtitle">Track all your rental requests</p>
  </div>

  <div class="rentals-grid" *ngIf="rentals.length > 0">
    <div class="rental-card" *ngFor="let r of rentals">
      <div class="rental-header">
        <h4>{{ r.equipmentName }}</h4>
        <span class="status-badge" [class.accepted]="r.verified" [class.pending]="!r.verified">
          {{ r.verified ? '✓ Accepted' : '⏳ Pending' }}
        </span>
      </div>
      <div class="rental-details">
        <div class="detail-row">
          <span class="detail-label">From</span>
          <span>{{ r.startDate | date:'dd/MM/yyyy' }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">To</span>
          <span>{{ r.endDate | date:'dd/MM/yyyy' }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Total</span>
          <span class="price">{{ r.totalAmount }} €</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Owner</span>
          <span>{{ r.ownerEmail }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="rentals.length === 0">
    <p>You have no rental requests yet.</p>
    <a routerLink="../rent" class="link-btn">Rent Equipment</a>
  </div>
</div>
