<div class="rent-maintenance-page">

  <!-- Hero -->
  <section class="page-hero">
    <div class="container">
      <h1 class="page-title">Rent & Maintenance</h1>
      <p class="page-description">Rent equipment or manage your own listings</p>
    </div>
  </section>

  <!-- Main content -->
  <section class="page-content section">
    <div class="container">

      <!-- MINI NAVBAR -->
      <div class="sub-navbar">
        <a routerLink="/rent-maintenance"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">
           Available Equipment
        </a>
        <a routerLink="/rent-maintenance/rent"
           routerLinkActive="active">
           Rent Equipment
        </a>
        <a routerLink="/rent-maintenance/my-equipment"
           routerLinkActive="active">
           My Equipment
        </a>
        <a routerLink="/rent-maintenance/my-rentals"
           routerLinkActive="active">
           My Rentals
        </a>
        <a routerLink="/rent-maintenance/received"
           routerLinkActive="active">
           Received Requests
        </a>
        <a routerLink="/rent-maintenance/search">Search</a>
        <a routerLink="/rent-maintenance/analytics">Analytics</a>
        <a routerLink="/rent-maintenance/storyies">Storyies</a>
      </div>

      <!-- Child content -->
      <router-outlet></router-outlet>

    </div>
  </section>

</div>
