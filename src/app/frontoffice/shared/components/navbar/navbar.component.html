<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-container">

    <!-- Brand Name Only -->
    <div class="navbar-brand" (click)="navigateTo('/home')">
      <span class="brand-name">CampConnect</span>
    </div>

    <!-- Desktop Navigation (centré) -->
    <ul class="nav-menu desktop-menu">
      <li 
        *ngFor="let item of navItems" 
        class="nav-item"
        [class.active]="item.active"
      >
        <a 
          [routerLink]="item.route"
          class="nav-link"
          routerLinkActive="active"
        >
          {{ item.label }}
        </a>
      </li>
    </ul>

    <!-- Action Buttons -->
    <div class="nav-actions">

      <!-- ✅ NON connecté -->
      <ng-container *ngIf="!isLoggedIn()">
        <button class="login-btn" routerLink="/login">Login</button>
        <button class="signup-btn" routerLink="/login/register">Sign Up</button>
      </ng-container>

      <!-- ✅ Connecté -->
      <ng-container *ngIf="isLoggedIn()">

        <!-- ✅ Dashboard uniquement pour ADMIN -->
        <button
          *ngIf="getRole() === 'ROLE_ADMIN'"
          class="dashboard-btn"
          routerLink="/admin">
          🛠️
        </button>

        
        <button class="logout-btn" (click)="logout()">Logout</button>
      </ng-container>

      <!-- Mobile Menu Toggle -->
      <button 
        class="mobile-menu-toggle" 
        (click)="toggleMobileMenu()"
        [class.open]="isMobileMenuOpen"
        aria-label="Toggle menu"
      >
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>

    </div>
  </div>

  <!-- Mobile Navigation -->
  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <ul class="mobile-nav-list">
      <li 
        *ngFor="let item of navItems" 
        class="mobile-nav-item"
      >
        <a 
          [routerLink]="item.route"
          class="mobile-nav-link"
          (click)="closeMobileMenu()"
        >
          {{ item.label }}
        </a>
      </li>
    </ul>

    <!-- ✅ Mobile Actions -->
    <div class="mobile-actions">

      <!-- NON connecté -->
      <ng-container *ngIf="!isLoggedIn()">
        <button class="mobile-login-btn" routerLink="/login">Login</button>
        <button class="mobile-signup-btn" routerLink="/login/register">Sign Up</button>
      </ng-container>

      <!-- Connecté -->
      <ng-container *ngIf="isLoggedIn()">

        <!-- ✅ Dashboard uniquement pour ADMIN -->
        <button
          *ngIf="getRole() === 'ROLE_ADMIN'"
          class="mobile-dashboard-btn"
          routerLink="/admin"
          (click)="closeMobileMenu()">
           🛠️ 
        </button>

        
        <button class="mobile-logout-btn" (click)="logout()">Logout</button>
      </ng-container>

    </div>
  </div>
</nav>
