<div class="notif-wrapper">
  <button class="notif-bell-btn" (click)="toggleDropdown()">
    <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    <span class="notif-badge" *ngIf="unreadCount > 0">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <div class="notif-dropdown" *ngIf="isOpen">
    <div class="notif-header">
      <span class="notif-title">Notifications</span>
      <button class="notif-mark-all" *ngIf="unreadCount > 0" (click)="markAllAsRead()">
        Mark all as read
      </button>
    </div>

    <div class="notif-list" *ngIf="notifications.length > 0">
      <div
        class="notif-item"
        *ngFor="let n of notifications"
        [class.notif-unread]="!n.read"
        (click)="markAsRead(n)">
        <div class="notif-icon-box" [ngClass]="'notif-icon-' + getIcon(n.type)">
          <svg *ngIf="n.type === 'DELIVERY_TAKEN'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
          </svg>
          <svg *ngIf="n.type === 'DELIVERY_COMPLETED'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>
        <div class="notif-content">
          <p class="notif-message">{{ n.message }}</p>
          <span class="notif-time">{{ getTimeAgo(n.createdAt) }}</span>
        </div>
        <span class="notif-dot" *ngIf="!n.read"></span>
      </div>
    </div>

    <div class="notif-empty" *ngIf="notifications.length === 0">
      <p>No notifications yet</p>
    </div>
  </div>
</div>
